server:
  port: 8080

spring:
  application:
    name: short-url
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # TODO 换成自己的数据库地址与账号
    url: jdbc:mysql://localhost:3306/short_url?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true
    username: root
    password: 1234
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  redis:
    host: localhost
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 32
        max-idle: 8
        min-idle: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，压测/生产请注释掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

short-url:
  # 发号策略：segment=号段+双Buffer（默认） | snowflake=雪花ID
  id-strategy: segment
  # 短链域名（生成完整短链时拼接）
  domain: http://localhost:8080/
  # 跳转状态码：302（不缓存，便于统计与随时改跳）| 301（浏览器缓存，省服务器压力但统计失真）
  redirect-code: 302
  bloom:
    # 预期插入量 n=1000万，误判率 p=1%
    # 位数 m = -n*ln(p)/(ln2)^2 ≈ 9585万 bit ≈ 11.4 MB（Redis SETBIT）
    expected-insertions: 10000000
    fpp: 0.01
  cache:
    maximum-size: 100000
    ttl-seconds: 300
  snowflake:
    worker-id: 1
    datacenter-id: 1
jwt:
  secret: "c3VwZXItc2VjcmV0LWtleS1mb3Itand0LWhzMjU2LTEyMzQ1Ng=="
  expiration: 86400000